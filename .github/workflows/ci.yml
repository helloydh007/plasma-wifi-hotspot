name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 后端与测试（bash -n / shellcheck / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      # 与本地完全同一套检查：语法、shellcheck、配置库单测、
      # 控制脚本 mock 端到端测试、backend 与插件包内副本一致性、QML 语法（若装了 qmllint）
      - name: 全部检查
        run: bash tests/run-all.sh

  qml:
    name: QML 语法（qmllint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: QML 语法检查
        run: |
          # Ubuntu 的 qt6-declarative-dev-tools 把 qmllint 放在 /usr/lib/qt6/bin（不在 PATH 里）。
          # 旧版 CI 因此每次都 "qmllint: command not found" 却打印 "QML 语法 OK" —— 一道空门。
          export PATH="$PATH:/usr/lib/qt6/bin"
          if ! command -v qmllint >/dev/null 2>&1; then
            echo "::error::CI 里找不到 qmllint：请不要静默跳过，要么修环境，要么删掉这一步"
            exit 1
          fi
          qmllint --version
          # 只看语法（CI 没有 Plasma 的 QML 模块，import 解析不了会有大量噪音警告）。
          # 用退出码判断，不 grep 文案（文案会变）。
          if ! qmllint --bare plasmoid/contents/ui/*.qml; then
            echo "::error::QML 有语法错误"
            exit 1
          fi
          # 自检：故意写坏的文件必须被判失败，证明这道门是活的
          bad=$(mktemp --suffix=.qml)
          cat plasmoid/contents/ui/main.qml > "$bad"; printf '\nItem { property int x: }\n' >> "$bad"
          if qmllint --bare "$bad" >/dev/null 2>&1; then
            echo "::error::QML 自检失败：写坏的文件竟然通过了"
            exit 1
          fi
          echo "QML 语法 OK（import 相关警告已忽略；自检通过）"
