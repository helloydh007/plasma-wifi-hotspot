name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 后端与测试（bash -n / shellcheck / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      # 与本地完全同一套检查：语法、shellcheck、配置库单测、
      # 控制脚本 mock 端到端测试、backend 与插件包内副本一致性、QML 语法（若装了 qmllint）
      - name: 全部检查
        run: bash tests/run-all.sh

  qml:
    name: QML 语法（qmllint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: QML 语法检查（版本无关；含"这道门是活的"自检）
        run: |
          # Ubuntu 的 qt6-declarative-dev-tools 把 qmllint 放在 /usr/lib/qt6/bin（不在 PATH 里），
          # 而且 24.04 上是 Qt 6.4：没有 --bare，且会因 import 噪音返回非零。
          # 这些差异统一由 tests/check-qml.sh 处理（本地与 CI 同一份实现）。
          export PATH="$PATH:/usr/lib/qt6/bin"
          if ! command -v qmllint >/dev/null 2>&1; then
            echo "::error::CI 里找不到 qmllint：不要静默跳过，请修环境"
            exit 1
          fi
          qmllint --version || true
          bash tests/check-qml.sh
